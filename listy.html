<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Авторские листы · Москва между нами</title>

<meta property="og:type" content="website">
<meta property="og:site_name" content="Москва между нами">
<meta property="og:title" content="Авторские листы · Москва между нами">
<meta property="og:description" content="Усыпальницы или места силы? Мифологическая экскурсия по семи сёстрам. Если богини не против — они покажут вам город.">
<meta name="description" content="Усыпальницы или места силы? Мифологическая экскурсия по семи сёстрам. Если богини не против — они покажут вам город.">

<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  --paper:#e9e1d2;
  --ink:#3a3326;
  --muted:#7d7562;
  --gold:#b9a24a;

  /* Карта на стене. Стена = весь экран, полей нет. */
  --map-scale:1.02;     /* >1 = края уходят за браузер, там секрет */
  --map-rot:0deg;       /* до 1deg, не больше */
  --map-opacity:.97;
  --map-blend:multiply; /* multiply = карта впитывается в бумагу; normal = плоская */
}

html,body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Georgia,serif;
}

/* Стена фиксирована. Несущая. = окно браузера целиком. */
.wall{
  position:relative;
  isolation:isolate;
  overflow:hidden;

  width:100vw;
  height:100vh;
  height:100svh;
}

.map{
  position:absolute;
  inset:0;
  z-index:1;

  background-image:url('michurin.jpg');
  background-size:100% auto;     /* по ширине экрана; низ уходит за край = обрезка */
    background-position:center center;/* центр карты = центр стены, края обрезаются со всех сторон */
  background-repeat:no-repeat;

  opacity:var(--map-opacity);
  mix-blend-mode:var(--map-blend);

  transform:scale(var(--map-scale)) rotate(var(--map-rot));
  transform-origin:center center;
}

/* Титр галереи лежит прямо на городе, справа сверху, чтобы не давить на картуш. */
.plate{
  position:absolute;
  z-index:2;
  top:clamp(16px,3vh,34px);
  right:clamp(16px,3vw,40px);
  max-width:min(46vw,520px);
  text-align:right;
  text-shadow:
    0 0 14px rgba(233,225,210,.95),
    0 0 4px rgba(233,225,210,.9),
    0 1px 2px rgba(233,225,210,.85);
}

.back{
  display:inline-block;
  margin-bottom:10px;
  color:var(--muted);
  text-decoration:none;
  font-size:13px;
  letter-spacing:1px;
  border-bottom:1px solid var(--gold);
}
.back:hover{color:var(--ink)}

.plate h1{
  font-size:clamp(26px,3.4vw,46px);
  line-height:1.02;
  margin:0 0 6px;
  letter-spacing:.5px;
}

.plate .sub{
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--muted);
  margin:0;
}

/* Узкий экран: карта заполняет целиком ценой картуша. Телефонный режим пересоберём отдельно. */
@media(max-width:700px){
  .map{background-size:cover;background-position:center}
  .plate{left:clamp(14px,4vw,24px);right:clamp(14px,4vw,24px);max-width:none;text-align:left}
}
</style>
</head>
<body>

<div class="wall" aria-label="Стена с Мичуринским планом Москвы">
  <div class="map" role="img" aria-label="Мичуринский план Москвы"></div>
  <div class="plate">
    <a class="back" href="index.html">← на главную</a>
    <h1>Авторские листы</h1>
    <p class="sub">стена · карта · коллаж</p>
  </div>
</div>

</body>
</html>
